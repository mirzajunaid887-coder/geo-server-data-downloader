<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>GIS Export</title>
<style>
  :root { --accent-color: #3b82f6; --border-color: #374151; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111827; color: #f3f4f6; }
  .card { display: flex; flex-direction: column; height: 100vh; }
  .header { display: flex; align-items: center; gap: 0.5rem; padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 0.95rem; }
  .header .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--accent-color); }
  .body { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
  .title { font-size: 0.9rem; font-weight: 700; color: #e5e7eb; margin: 0; }
  .detail { font-size: 0.78rem; color: #9ca3af; margin: 0; word-break: break-word; }
  .spinner { width: 2rem; height: 2rem; border: 3px solid #374151; border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0.5rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log { flex: 1; min-height: 100px; max-height: 220px; overflow-y: auto; background: #1f2937; border: 1px solid var(--border-color); border-radius: 0.375rem; padding: 0.5rem; font-size: 0.72rem; color: #9ca3af; font-family: ui-monospace, monospace; }
  .log div { padding: 0.1rem 0; }
  .error { display: none; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 0.6rem; border-radius: 0.375rem; }
  .done { display: none; flex-direction: column; align-items: center; gap: 0.6rem; padding: 1rem 0; text-align: center; }
  .done p { margin: 0; font-size: 0.85rem; color: #a7f3d0; }
  .pre { display: none; flex-direction: column; gap: 0.6rem; font-size: 0.8rem; }
  .pre .facts { color: #e5e7eb; margin: 0; line-height: 1.5; }
  .pre .warn { color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 0.55rem; border-radius: 0.375rem; margin: 0; line-height: 1.5; }
  .pre .fields { color: #9ca3af; font-size: 0.72rem; margin: 0; word-break: break-word; }
  .pre label { display: flex; flex-direction: column; gap: 0.25rem; color: #9ca3af; font-size: 0.72rem; }
  .pre input, .pre select { background: #1f2937; color: #f3f4f6; border: 1px solid var(--border-color); border-radius: 0.375rem; padding: 0.45rem; font-size: 0.8rem; font-family: inherit; }
  .pre .row { display: flex; gap: 0.5rem; }
  .pre .row input { flex: 1; min-width: 0; }
  button.sec-btn { background: #374151; border: none; color: #f3f4f6; padding: 0.45rem 0.8rem; border-radius: 0.375rem; font-size: 0.78rem; cursor: pointer; }
  .bar { display: none; height: 8px; border-radius: 4px; background: #1f2937; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent-color); transition: width 0.3s ease; }
  .keep { display: none; font-size: 0.74rem; color: #fbbf24; margin: 0; line-height: 1.5; }
  button.close-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  button.close-btn { background: var(--accent-color); border: none; color: white; padding: 0.5rem 1.1rem; border-radius: 0.375rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="header"><span class="dot"></span> GIS Export</div>
  <div class="body">
    <div class="spinner" id="spinner"></div>
    <p class="title" id="title">Preparing export...</p>
    <p class="detail" id="detail"></p>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <p class="keep" id="keep">Large layer: keep this tab open until the download finishes. It saves to disk as it goes, so it will not run out of memory, but it can take several minutes. You can keep using other tabs.</p>
    <div class="log" id="log"></div>
    <div class="pre" id="pre">
      <p class="facts" id="preFacts"></p>
      <p class="warn" id="preWarn" style="display:none"></p>
      <p class="fields" id="preFields"></p>
      <label>Only download features where (optional, ArcGIS SQL)
        <span class="row"><input id="preWhere" type="text" placeholder="e.g. ZIP = '77002'" autocomplete="off" /><button class="sec-btn" id="preCheck" type="button">Check count</button></span>
      </label>
      <label>Format
        <select id="preFormat">
          <option value="shp">ESRI Shapefile (.zip)</option>
          <option value="geojson">GeoJSON</option>
          <option value="csv">CSV (geometry as WKT)</option>
          <option value="gpkg">GeoPackage (.gpkg) - up to 100,000 features</option>
          <option value="kml">KML (always WGS84) - up to 100,000 features</option>
        </select>
      </label>
      <button class="close-btn" id="preStart" type="button">Start download</button>
    </div>
    <div class="error" id="error"></div>
    <div class="done" id="done">
      <p id="doneMsg">Download complete.</p>
      <button class="close-btn" id="closeBtn">Close window</button>
    </div>
  </div>
</div>
<script>
  window.CONFIG = (function () {
    try { return JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))); }
    catch (e) { return null; }
  })();
  if (!window.CONFIG) { document.addEventListener("DOMContentLoaded", function () { showError("This export window was opened without any layers. Close it and start the export again from the Downloader."); }); }


  function setTitle(t) { document.getElementById("title").textContent = t; }
  function setDetail(t) { document.getElementById("detail").textContent = t; }
  function log(t) {
    const el = document.getElementById("log");
    const line = document.createElement("div");
    line.textContent = t;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }
  function showError(msg) {
    document.getElementById("spinner").style.display = "none";
    const errEl = document.getElementById("error");
    errEl.style.display = "flex";
    errEl.textContent = msg;
    setTitle("Export failed");
  }
  function showDone(msg) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("done").style.display = "flex";
    document.getElementById("doneMsg").textContent = msg;
  }
  document.getElementById("closeBtn").addEventListener("click", function () { window.close(); });
</script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" onerror="showError('Failed to load JSZip from the CDN. Check your internet connection and try again.')"></script>
<script src="https://cdn.jsdelivr.net/npm/@terraformer/arcgis@2.1.2/dist/t-arcgis.umd.js" onerror="showError('Failed to load the Esri JSON converter from the CDN. Check your internet connection and try again.')"></script>
<script src="https://cdn.jsdelivr.net/npm/gdal3.js@2.8.1/dist/package/gdal3.js" onerror="showError('Failed to load GDAL WebAssembly from the CDN. Check your internet connection and try again.')"></script>
<script src="/stream-export.js"></script>

<script>
  function baseUrl(serviceUrl) {
    return String(serviceUrl || "").trim().split("#")[0].split("?")[0].replace(/\/query\/?$/i, "").replace(/\/+$/, "");
  }

  // Single-layer "Download now" exports:
  //  - Shapefile, GeoJSON and CSV of ANY size are streamed to disk (stream-export.js), no size limit.
  //  - GeoPackage and KML need GDAL, which works in memory: fine up to GDAL_MAX features (warning above GDAL_AUTO).
  var GDAL_AUTO = (window.CONFIG && window.CONFIG.streamAt) || 25000;
  var GDAL_MAX = (window.CONFIG && window.CONFIG.gdalMax) || 100000;
  function isStreamFormat(f) { return f === "shp" || f === "geojson" || f === "csv"; }

  var PAGE_SIZE = 200;
  var CONCURRENCY = 6;

  function describeError(err) {
    if (!err) return "Unknown ArcGIS error";
    if (typeof err === "string") return err;
    var details = Array.isArray(err.details) && err.details.length ? " (" + err.details.join("; ") + ")" : "";
    return (err.message || "ArcGIS server error") + (err.code ? " [code " + err.code + "]" : "") + details;
  }

  // Same transport rule as the ArcGIS JS SDK: GET when short, form-encoded POST when long.
  async function arcgisRequest(url, params) {
    let lastErr = null;
    for (let attempt = 0; attempt <= 3; attempt++) {
      if (attempt > 0) await new Promise(function (r) { setTimeout(r, 400 * Math.pow(2, attempt - 1) + Math.random() * 200); });
      try { return await arcgisRequestOnce(url, params); }
      catch (e) { lastErr = e; if (!(e && e.transient) && !(e instanceof TypeError)) throw e; }
    }
    throw lastErr;
  }

  async function arcgisRequestOnce(url, params) {
    const body = new URLSearchParams(Object.assign({}, params, { f: "json" }));
    const getUrl = url + "?" + body.toString();
    const res = getUrl.length < 2000
      ? await fetch(getUrl)
      : await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        });
    if (!res.ok) { const he = new Error("HTTP " + res.status + " " + res.statusText + " from " + url); he.transient = res.status === 429 || res.status >= 500; throw he; }
    const json = await res.json();
    if (json && json.error) throw new Error(describeError(json.error));
    return json;
  }

  async function fetchObjectIds(serviceUrl, where) {
    const data = await arcgisRequest(baseUrl(serviceUrl) + "/query", { where: where || "1=1", returnIdsOnly: "true" });
    return data.objectIds || [];
  }

  async function fetchCount(serviceUrl, where) {
    const data = await arcgisRequest(baseUrl(serviceUrl) + "/query", { where: where || "1=1", returnCountOnly: "true" });
    return typeof data.count === "number" ? data.count : null;
  }

  // Esri spatial reference -> a name GDAL understands (EPSG:n, ESRI:n or WKT).
  function srsString(sr) {
    if (!sr) return null;
    const id = sr.latestWkid || sr.wkid;
    if (id) return (id >= 100000 ? "ESRI:" : "EPSG:") + id;
    return sr.wkt || null;
  }
  // Short, readable name for messages (WKT -> its quoted name).
  function srsLabel(srs) {
    const m = /^(?:PROJCS|GEOGCS|PROJCRS|GEOGCRS)\["([^"]+)"/.exec(srs || "");
    return m ? m[1] : srs;
  }
  // What to send as outSR so the server returns coordinates in that same system.
  function outSrParam(sr) {
    if (!sr) return null;
    if (sr.wkid) return String(sr.wkid);
    if (sr.wkt) return JSON.stringify({ wkt: sr.wkt });
    return null;
  }

  async function fetchLayerInfo(serviceUrl) {
    const meta = await arcgisRequest(baseUrl(serviceUrl), {});
    const fieldTypes = {};
    let oidField = null;
    (meta.fields || []).forEach(function (f) {
      if (f && f.name && f.type) {
        fieldTypes[f.name] = f.type;
        if (!oidField && f.type === "esriFieldTypeOID") oidField = f.name;
      }
    });
    return {
      fieldTypes: fieldTypes,
      oidField: oidField || meta.objectIdField || "OBJECTID",
      sr: (meta.extent && meta.extent.spatialReference) || meta.spatialReference || null,
      geometryType: meta.geometryType || "",
      fields: meta.fields || [],
      maxRecordCount: meta.maxRecordCount || 1000,
      fieldNames: (meta.fields || []).map(function (f) { return f.name; }),
    };
  }

  function hasValidGeometry(f) {
    const g = f && f.geometry;
    if (!g) return false;
    if (g.rings) return g.rings.every(function (r) { return r && r.length > 1; });
    if (g.paths) return g.paths.every(function (p) { return p && p.length > 0; });
    if (g.points) return g.points.length > 0;
    return g.x !== undefined && g.y !== undefined;
  }

  // One page of Esri JSON features. Mirrors geodatadownloader: where OID IN (...), f=json, outSR=4326.
  async function queryPage(base, oidField, ids, opts) {
    opts = opts || {};
    const common = { outFields: "*", returnGeometry: "true" };
    // Default: WGS84 (lon/lat). Native mode: ask for the layer's own coordinate system.
    if (opts.outSR) common.outSR = opts.outSR; else if (!opts.native) common.outSR = "4326";
    const attempts = [
      Object.assign({}, common, { where: oidField + " IN (" + ids.join(",") + ")" }),
      Object.assign({}, common, { objectIds: ids.join(",") }),
    ];
    let lastError = null;
    for (const params of attempts) {
      try {
        const data = await arcgisRequest(base + "/query", params);
        return data.features || [];
      } catch (e) {
        lastError = e;
      }
    }
    if (ids.length > 1) {
      const mid = Math.ceil(ids.length / 2);
      const left = await queryPage(base, oidField, ids.slice(0, mid), opts);
      const right = await queryPage(base, oidField, ids.slice(mid), opts);
      return left.concat(right);
    }
    throw new Error("Query failed for feature " + oidField + "=" + ids[0] + ": " + (lastError && lastError.message));
  }

  async function fetchFeaturesBatch(serviceUrl, ids, oidField, onProgress, opts) {
    const base = baseUrl(serviceUrl);
    const pages = [];
    for (let i = 0; i < ids.length; i += PAGE_SIZE) pages.push(ids.slice(i, i + PAGE_SIZE));
    const results = new Array(pages.length);
    let next = 0;
    let done = 0;
    async function worker() {
      while (true) {
        const i = next++;
        if (i >= pages.length) return;
        const esriFeatures = (await queryPage(base, oidField, pages[i], opts)).filter(hasValidGeometry);
        const fc = window.Terraformer.arcgisToGeoJSON({ features: esriFeatures, spatialReference: { wkid: 4326 } });
        results[i] = fc.features || [];
        done++;
        onProgress(done, pages.length);
      }
    }
    const workers = [];
    for (let w = 0; w < Math.min(CONCURRENCY, pages.length); w++) workers.push(worker());
    await Promise.all(workers);
    return [].concat.apply([], results);
  }

  var WFS_PAGE_SIZE = 1000;
  var WFS_FORMATS = ["application/json", "application/json; subtype=geojson", "json", "geojson", "GEOJSON"];
  var WFS_RESERVED = ["service", "request", "version", "typename", "typenames", "outputformat", "count", "maxfeatures", "startindex", "resulttype", "srsname", "acceptversions"];

  function wfsUrl(endpoint, params) {
    const u = new URL(endpoint);
    Array.from(u.searchParams.keys()).forEach(function (k) {
      if (WFS_RESERVED.indexOf(k.toLowerCase()) !== -1) u.searchParams.delete(k);
    });
    Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
    return u.toString();
  }

  function wfsSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function wfsFetch(url, retryOnStatus) {
    let lastErr = null;
    for (let attempt = 0; attempt <= 3; attempt++) {
      if (attempt > 0) await wfsSleep(400 * Math.pow(2, attempt - 1) + Math.random() * 200);
      try {
        const res = await fetch(url);
        if (retryOnStatus && (res.status === 429 || res.status >= 500)) { lastErr = new Error("HTTP " + res.status + " " + res.statusText); continue; }
        return res;
      } catch (e) { lastErr = e; }
    }
    throw new Error("Could not reach the WFS server (" + (lastErr && lastErr.message) + "). The URL may be wrong, or the server may not allow cross-origin (CORS) requests from a browser.");
  }

  function wfsVersionParts(v) {
    const p = String(v || "2.0.0").split(".");
    return [parseInt(p[0], 10) || 2, parseInt(p[1], 10) || 0];
  }

  function wfsExceptionText(text) {
    try {
      const doc = new DOMParser().parseFromString(text, "application/xml");
      const el = doc.getElementsByTagNameNS("*", "ExceptionText")[0] || doc.getElementsByTagNameNS("*", "ServiceException")[0];
      return el && el.textContent ? el.textContent.trim() : null;
    } catch (e) { return null; }
  }

  function wfsParams(ctx, format, start, count) {
    const vp = wfsVersionParts(ctx.version);
    const params = { service: "WFS", version: ctx.version, request: "GetFeature", outputFormat: format };
    if (vp[0] >= 2) {
      params.typeNames = ctx.typeName;
      if (count !== undefined) { params.count = String(count); params.startIndex = String(start); }
    } else {
      params.typeName = ctx.typeName;
      if (vp[0] === 1 && vp[1] >= 1 && count !== undefined) { params.maxFeatures = String(count); params.startIndex = String(start); }
    }
    return params;
  }

  async function wfsReadGeoJson(res) {
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); }
    catch (e) { throw new Error(wfsExceptionText(text) || "response was not JSON"); }
    if (!json || !Array.isArray(json.features)) throw new Error("response was not a GeoJSON FeatureCollection");
    const total = json.numberMatched !== undefined ? json.numberMatched : json.totalFeatures;
    return { features: json.features, total: typeof total === "number" ? total : undefined, crs: json.crs };
  }

  async function wfsRequestPage(ctx, start, count) {
    const probing = ctx.format === undefined;
    const formats = probing ? WFS_FORMATS : [ctx.format];
    let lastError = "unknown error";
    for (const format of formats) {
      const res = await wfsFetch(wfsUrl(ctx.baseUrl, wfsParams(ctx, format, start, count)), !probing);
      if (!res.ok && !probing) throw new Error("WFS GetFeature failed: HTTP " + res.status + " " + res.statusText);
      try {
        if (!res.ok) throw new Error("HTTP " + res.status);
        const page = await wfsReadGeoJson(res);
        ctx.format = format;
        return page;
      } catch (e) { lastError = e.message; }
    }
    throw new Error("The WFS server did not return GeoJSON for \"" + ctx.typeName + "\" (" + lastError + "). Only servers that can output GeoJSON are supported.");
  }

  async function wfsHits(ctx) {
    const vp = wfsVersionParts(ctx.version);
    if (vp[0] < 2 && !(vp[0] === 1 && vp[1] >= 1)) return null;
    try {
      const params = { service: "WFS", version: ctx.version, request: "GetFeature", resultType: "hits" };
      params[vp[0] >= 2 ? "typeNames" : "typeName"] = ctx.typeName;
      const res = await wfsFetch(wfsUrl(ctx.baseUrl, params), true);
      if (!res.ok) return null;
      const root = new DOMParser().parseFromString(await res.text(), "application/xml").documentElement;
      const matched = root.getAttribute("numberMatched") || root.getAttribute("numberOfFeatures");
      if (matched && matched !== "unknown") { const n = parseInt(matched, 10); return isNaN(n) ? null : n; }
    } catch (e) { /* count is optional */ }
    return null;
  }

  function wfsKey(f) {
    if (!f) return "";
    return String(f.id !== undefined && f.id !== null ? f.id : JSON.stringify(f.geometry || "").slice(0, 300) + JSON.stringify(f.properties || ""));
  }

  async function wfsRange(ctx, start, expected) {
    const features = [];
    let crs;
    while (features.length < expected) {
      const page = await wfsRequestPage(ctx, start + features.length, expected - features.length);
      crs = crs || page.crs;
      if (page.features.length === 0) break;
      for (const f of page.features) features.push(f);
    }
    return { features: features, crs: crs };
  }

  async function fetchWfsCollection(layer, onProgress) {
    const ctx = { baseUrl: layer.url, typeName: layer.typeName, version: layer.version || "2.0.0" };
    const vp = wfsVersionParts(ctx.version);

    if (vp[0] === 1 && vp[1] === 0) {
      const only = await wfsRequestPage(ctx, 0, undefined);
      onProgress(only.features.length, only.features.length);
      return { features: only.features, crs: only.crs };
    }

    const hits = await wfsHits(ctx);
    const first = await wfsRequestPage(ctx, 0, WFS_PAGE_SIZE);
    const total = hits !== null ? hits : first.total;
    const features = first.features.slice();
    let crs = first.crs;
    onProgress(features.length, total);

    if (features.length > 0) {
      if (total !== undefined) {
        const step = first.features.length;
        const starts = [];
        for (let st = step; st < total; st += step) starts.push(st);
        const results = new Array(starts.length);
        let next = 0;
        let fetched = features.length;
        const worker = async function () {
          while (true) {
            const i = next++;
            if (i >= starts.length) return;
            const st = starts[i];
            const r = await wfsRange(ctx, st, Math.min(step, total - st));
            if (r.features.length > 0 && wfsKey(r.features[0]) === wfsKey(first.features[0])) {
              throw new Error("The WFS server ignores startIndex, so it cannot be paged reliably.");
            }
            crs = crs || r.crs;
            results[i] = r.features;
            fetched += r.features.length;
            onProgress(fetched, total);
          }
        };
        const workers = [];
        for (let w = 0; w < Math.min(4, starts.length); w++) workers.push(worker());
        await Promise.all(workers);
        for (const r of results) { if (r) for (const f of r) features.push(f); }
      } else {
        let prevKey = wfsKey(first.features[0]);
        while (true) {
          const page = await wfsRequestPage(ctx, features.length, WFS_PAGE_SIZE);
          crs = crs || page.crs;
          if (page.features.length === 0) break;
          const key = wfsKey(page.features[0]);
          if (key === prevKey) break;
          prevKey = key;
          for (const f of page.features) features.push(f);
          onProgress(features.length, undefined);
        }
      }
    }
    onProgress(features.length, total !== undefined ? total : features.length);
    return { features: features, crs: crs };
  }

  function applyDateFormatting(features, fieldTypes) {
    return features.map(function (f) {
      const props = f.properties || f.attributes;
      if (!props) return f;
      Object.keys(props).forEach(function (k) {
        if (fieldTypes[k] === "esriFieldTypeDate" && typeof props[k] === "number") {
          const d = new Date(props[k]);
          if (!isNaN(d.getTime())) props[k] = d.toISOString();
        }
      });
      return f;
    });
  }

  function $(id) { return document.getElementById(id); }

  var GEOM_LABELS = { esriGeometryPolygon: "polygons", esriGeometryPolyline: "lines", esriGeometryPoint: "points", esriGeometryMultipoint: "points", esriGeometryEnvelope: "envelopes" };

  // Single-layer "Download now" check: count the features (optionally filtered) before downloading.
  // Small layers start by themselves. Big ones wait here so the tab does not run out of memory.
  async function runPreflight(layer, format, where) {
    setTitle("Checking the layer...");
    setDetail("Reading layer details and counting features...");
    const info = await fetchLayerInfo(layer.url);
    let count = await fetchCount(layer.url, where);
    if (count !== null && count > 0 && (count <= GDAL_AUTO || isStreamFormat(format))) return { format: format, where: where, info: info, count: count };

    $("spinner").style.display = "none";
    setTitle(layer.name);
    setDetail("");
    $("pre").style.display = "flex";
    $("preFormat").value = format;
    $("preWhere").value = where;
    if (window.CONFIG.whereHint) $("preWhere").placeholder = "e.g. " + String(window.CONFIG.whereHint);
    const crsLabel = srsLabel(srsString(info.sr)) || "unknown coordinate system";
    $("preFields").textContent = info.fieldNames.length ? "Fields: " + info.fieldNames.slice(0, 14).join(", ") + (info.fieldNames.length > 14 ? ", ..." : "") : "";

    function render(message) {
      const geom = GEOM_LABELS[info.geometryType] || "features";
      const fmt = $("preFormat").value;
      $("preFacts").textContent = (count === null ? "Could not count the features" : count.toLocaleString() + " " + geom) + " \u00b7 " + crsLabel;
      let warn = message || "";
      let blocked = false;
      if (!warn) {
        if (count === 0) { warn = "No features match. Change the filter."; blocked = true; }
        else if (!isStreamFormat(fmt) && count !== null && count > GDAL_MAX) { warn = "GeoPackage and KML are built in memory and are limited to " + GDAL_MAX.toLocaleString() + " features. Choose Shapefile, GeoJSON or CSV: those are written straight to disk and have no size limit."; blocked = true; }
        else if (!isStreamFormat(fmt) && count !== null && count > GDAL_AUTO) { warn = "This is a large layer for GeoPackage/KML. It is built in this tab's memory and can run out of memory on a small computer. Shapefile, GeoJSON and CSV have no such limit."; }
        else if (count === null) { warn = "The server did not report a count. You can still try the download."; }
      } else blocked = count === 0;
      const w = $("preWarn");
      w.style.display = warn ? "block" : "none";
      w.textContent = warn;
      $("preStart").disabled = blocked;
    }
    render();

    $("preFormat").onchange = function () { render(); };
    return new Promise(function (resolve) {
      let busy = false;
      async function recount() {
        const w = $("preWhere").value.trim();
        try { count = await fetchCount(layer.url, w); render(); return true; }
        catch (e) { count = null; render("The server rejected that filter: " + (e && e.message ? e.message : e)); $("preStart").disabled = true; return false; }
      }
      $("preCheck").onclick = async function () { if (busy) return; busy = true; await recount(); busy = false; };
      $("preStart").onclick = async function () {
        if (busy) return; busy = true;
        const ok = await recount();
        busy = false;
        if (!ok || $("preStart").disabled) return;
        if (!isStreamFormat($("preFormat").value) && count !== null && count > GDAL_MAX) return;
        $("pre").style.display = "none";
        $("spinner").style.display = "block";
        resolve({ format: $("preFormat").value, where: $("preWhere").value.trim(), info: info, count: count });
      };
    });
  }

  function setBar(frac) {
    $("bar").style.display = "block";
    $("barFill").style.width = Math.max(0, Math.min(100, Math.round(frac * 1000) / 10)) + "%";
  }

  // The shapefile .prj text for a coordinate system, produced by GDAL from a one-point probe file.
  async function makePrj(gdal, srs) {
    const probe = new File([JSON.stringify({ type: "FeatureCollection", features: [{ type: "Feature", properties: { a: 1 }, geometry: { type: "Point", coordinates: [0, 0] } }] })], "prj_probe.geojson");
    const opened = await gdal.open(probe);
    await gdal.ogr2ogr(opened.datasets[0], ["-f", "ESRI Shapefile", "-a_srs", srs], "prj_probe_out");
    const outs = await gdal.getOutputFiles();
    const prj = outs.find(function (f) { return /prj_probe_out[^/]*\.prj$/i.test(f.path); });
    if (!prj) throw new Error("Could not create the projection file for " + srs + ".");
    const bytes = await gdal.getFileBytes(prj.path);
    try { await gdal.close(opened.datasets[0]); } catch (e) { /* ignore */ }
    return new TextDecoder().decode(bytes);
  }

  // Layers too big for memory: stream Shapefile / GeoJSON / CSV straight to disk.
  async function runStreamExport(gdal, layer, layerInfo, ids, format, native, layerSrs, queryOpts, fileBase, safeName) {
    if (!window.GddStream) throw new Error("The large-download engine did not load. Reload this page and try again.");
    $("keep").style.display = "block";
    setTitle("Downloading " + layer.name);
    const srs = layerSrs || "EPSG:4326";
    let prjText = null;
    if (format === "shp") { setDetail("Preparing the projection file..."); prjText = await makePrj(gdal, srs); }
    const res = await window.GddStream.run({
      layerName: layer.name,
      base: baseUrl(layer.url),
      info: layerInfo,
      ids: ids,
      format: format,
      native: native,
      srs: srs,
      outSR: queryOpts.outSR || null,
      fileBase: fileBase || safeName,
      maxRecordCount: layerInfo.maxRecordCount,
      partBytes: window.CONFIG.partBytes,
      forceZip64: window.CONFIG.forceZip64,
      prjText: prjText,
      deps: { arcgisRequest: arcgisRequest, hasValidGeometry: hasValidGeometry, applyDateFormatting: applyDateFormatting, Terraformer: window.Terraformer },
      ui: {
        status: setDetail,
        progress: function (frac, text) { setBar(frac); if (text) setDetail(text); },
        log: log,
      },
    });
    setTitle("Starting download...");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(res.file);
    link.download = res.filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    let note = "";
    if (native) note = format === "csv" ? " CSV files carry no projection information: the coordinates are in " + srsLabel(srs) + "." : " Coordinate system: " + srsLabel(srs) + ".";
    if (res.parts > 1) note += " The shapefile was split into " + res.parts + " parts because one shapefile cannot pass 2 GB.";
    $("keep").style.display = "none";
    $("bar").style.display = "none";
    showDone(res.filename + " (" + res.features.toLocaleString() + " features) has been saved to your downloads." + note);
  }

  async function run() {
    try {
      const layers = window.CONFIG.layers;
      let format = window.CONFIG.format;
      let where = String(window.CONFIG.where || "").trim();
      const native = window.CONFIG.crs === "native";
      const fileBase = window.CONFIG.filename ? String(window.CONFIG.filename).replace(/[^a-zA-Z0-9_-]/g, "_") : "";

      setTitle("Validating layer endpoints...");
      for (const layer of layers) {
        if (layer.type === "wfs") continue;
        setDetail(`Checking connection to ${layer.name}...`);
        const res = await fetch(`${baseUrl(layer.url)}?f=pjson`);
        if (!res.ok) throw new Error(`Cannot reach "${layer.name}" (HTTP ${res.status}).`);
        const meta = await res.json();
        if (meta.error) throw new Error(meta.error.message || `ArcGIS service error for "${layer.name}".`);
      }

      if (window.CONFIG.preflight && layers.length === 1 && layers[0].type !== "wfs") {
        const pre = await runPreflight(layers[0], format, where);
        format = pre.format;
        where = pre.where;
      }

      setTitle("Initializing download engine...");
      setDetail("Loading GDAL WebAssembly environment from CDN...");
      if (typeof window.JSZip !== "function") throw new Error("JSZip did not load from the CDN.");
      if (!window.Terraformer || typeof window.Terraformer.arcgisToGeoJSON !== "function") throw new Error("Esri JSON converter did not load from the CDN.");
      if (typeof window.initGdalJs !== "function") throw new Error("GDAL WebAssembly did not load from the CDN.");
      const JSZip = window.JSZip;
      const gdal = await window.initGdalJs({
        path: "https://cdn.jsdelivr.net/npm/gdal3.js@2.8.1/dist/package",
        useWorker: false,
      });

      const mainZip = new JSZip();
      const layerDatasets = [];

      for (let i = 0; i < layers.length; i++) {
        const layer = layers[i];
        const safeName = layer.name.replace(/[^a-zA-Z0-9_-]/g, "_");

        setTitle(`Layer ${i + 1} of ${layers.length}: ${layer.name}`);

        let features;
        let layerCrs;
        let layerSrs = null;
        if (layer.type === "wfs") {
          setDetail("Requesting features from the WFS server...");
          const wfsResult = await fetchWfsCollection(layer, function (done, total) {
            setDetail("Downloading features: " + done.toLocaleString() + (total ? " / " + total.toLocaleString() : ""));
          });
          if (!wfsResult.features || wfsResult.features.length === 0) throw new Error(`No features returned for WFS layer "${layer.name}".`);
          log(`${layer.name}: ${wfsResult.features.length.toLocaleString()} features downloaded.`);
          features = wfsResult.features;
          layerCrs = wfsResult.crs;
        } else {
          setDetail("Reading field metadata...");
          const layerInfo = await fetchLayerInfo(layer.url);
          const fieldTypes = layerInfo.fieldTypes;

          const queryOpts = {};
          if (native) {
            layerSrs = srsString(layerInfo.sr);
            queryOpts.native = true;
            queryOpts.outSR = outSrParam(layerInfo.sr);
            if (!layerSrs) throw new Error(`"${layer.name}" does not report its coordinate system, so its original projection cannot be kept. Use the Downloader page instead.`);
            log(`${layer.name}: keeping the original coordinate system (${layerSrs}).`);
          }

          setDetail(where ? "Fetching Object IDs for the filter..." : "Fetching Object IDs from FeatureServer...");
          const ids = await fetchObjectIds(layer.url, where);
          if (!ids || ids.length === 0) throw new Error(`No features or Object IDs returned for layer "${layer.name}".`);
          log(`${layer.name}: ${ids.length.toLocaleString()} features found.`);

          if (window.CONFIG.preflight && layers.length === 1) {
            if (isStreamFormat(format) && ids.length > GDAL_AUTO) {
              await runStreamExport(gdal, layer, layerInfo, ids, format, native, layerSrs, queryOpts, fileBase, safeName);
              return;
            }
            if (!isStreamFormat(format) && ids.length > GDAL_MAX) {
              throw new Error("GeoPackage and KML are limited to " + GDAL_MAX.toLocaleString() + " features. This layer has " + ids.length.toLocaleString() + ". Choose Shapefile, GeoJSON or CSV, which are written straight to disk with no size limit.");
            }
          }

          const rawFeatures = await fetchFeaturesBatch(layer.url, ids, layerInfo.oidField, (chunkIndex, totalChunks) => {
            setDetail(`Downloading features: chunk ${chunkIndex} / ${totalChunks}`);
          }, queryOpts);
          if (!rawFeatures || rawFeatures.length === 0) throw new Error(`Failed to retrieve feature records for layer "${layer.name}".`);
          features = applyDateFormatting(rawFeatures, fieldTypes);
        }
        log(`${layer.name}: ready for conversion.`);

        const fc = layerCrs ? { type: "FeatureCollection", crs: layerCrs, features: features } : { type: "FeatureCollection", features: features };
        const rawBytes = new TextEncoder().encode(JSON.stringify(fc));
        const geojsonFile = new File([rawBytes], `${safeName}.geojson`, { type: "application/geo+json" });

        const openResult = await gdal.open(geojsonFile);
        if (!openResult || !openResult.datasets || openResult.datasets.length === 0) {
          throw new Error(`GDAL could not open the downloaded data for layer "${layer.name}".`);
        }
        layerDatasets.push({ name: safeName, dataset: openResult.datasets[0], srs: layerSrs });
      }

      let blob, filename;
      // Label the data with its real coordinate system (no reprojection) when native mode is on.
      const aSrs = function (item) { return item.srs ? ["-a_srs", item.srs] : []; };

      async function collectLayerOutputFiles(zipInstance) {
        const outputFiles = await gdal.getOutputFiles();
        for (const fileInfo of outputFiles) {
          const fileName = fileInfo.path.split("/").pop();
          const belongsToLayer = layerDatasets.some(function (item) {
            return fileName.indexOf(item.name) === 0;
          });
          if (belongsToLayer) {
            const fileBytes = await gdal.getFileBytes(fileInfo.path);
            zipInstance.file(fileName, fileBytes);
          }
        }
      }

      if (format === "gpkg") {
        setTitle("Creating GeoPackage...");
        setDetail("Converting layers into a single .gpkg container...");
        let gpkgPath = null;
        for (let j = 0; j < layerDatasets.length; j++) {
          const item = layerDatasets[j];
          const options = (j === 0
            ? ["-f", "GPKG", "-nln", item.name]
            : ["-update", "-append", "-f", "GPKG", "-nln", item.name]).concat(aSrs(item));
          setDetail(j === 0 ? `Creating GeoPackage with ${item.name}...` : `Appending ${item.name} to GeoPackage...`);
          gpkgPath = await gdal.ogr2ogr(item.dataset, options, "download");
        }
        if (!gpkgPath) throw new Error("GeoPackage generation resulted in empty output.");
        setDetail("Finalizing GeoPackage download...");
        const finalBuffer = await gdal.getFileBytes(gpkgPath);
        blob = new Blob([finalBuffer], { type: "application/x-sqlite3" });
        filename = fileBase ? fileBase + ".gpkg" : "download.gpkg";
      } else if (format === "shp") {
        setTitle("Creating ESRI Shapefiles...");
        for (let k = 0; k < layerDatasets.length; k++) {
          const item = layerDatasets[k];
          setDetail(`Converting ${item.name} to Shapefile (${k + 1}/${layerDatasets.length})...`);
          await gdal.ogr2ogr(item.dataset, ["-f", "ESRI Shapefile"].concat(aSrs(item)), item.name);
        }
        setDetail("Collecting Shapefile components...");
        await collectLayerOutputFiles(mainZip);
        setDetail("Compressing Shapefiles into ZIP archive...");
        blob = await mainZip.generateAsync({ type: "blob" });
        filename = fileBase ? fileBase + "_shapefile.zip" : "download.zip";
      } else {
        setTitle(`Converting to ${format.toUpperCase()}...`);
        const driverMap = { geojson: "GeoJSON", csv: "CSV", kml: "KML", gpx: "GPX" };
        const driver = driverMap[format] || "GeoJSON";
        for (let m = 0; m < layerDatasets.length; m++) {
          const item = layerDatasets[m];
          setDetail(`Processing ${item.name} (${m + 1}/${layerDatasets.length})...`);
          const options = ["-f", driver].concat(aSrs(item));
          if (driver === "CSV") {
            options.push("-lco", "GEOMETRY=AS_WKT");
          }
          await gdal.ogr2ogr(item.dataset, options, item.name);
        }
        setDetail("Collecting output files...");
        await collectLayerOutputFiles(mainZip);
        setDetail("Compressing archive files...");
        blob = await mainZip.generateAsync({ type: "blob" });
        filename = fileBase ? `${fileBase}_${format}.zip` : `gis_bulk_export_${format}.zip`;
      }

      for (const item of layerDatasets) {
        try { await gdal.close(item.dataset); } catch (e) {}
      }

      setTitle("Starting download...");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      const crsNote = layerDatasets[0] && layerDatasets[0].srs
        ? (format === "kml" || format === "gpx"
            ? " KML and GPX are always WGS84 (EPSG:4326), so the data was reprojected."
            : " Coordinate system: " + srsLabel(layerDatasets[0].srs) + ".")
        : "";
      showDone(`${filename} has been saved to your downloads.` + crsNote);
    } catch (err) {
      console.error("Export error:", err);
      showError((err && err.message) || "Failed to complete export pipeline.");
    }
  }

  run();
</script>

</body>
</html>
